<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">Phase 7 production LangGraph, human resume and action verification</title>
  <desc id="desc">Human questions and approvals interrupt tools; validated API responses resume the same thread. Action finish routes through independent database checks and goal interpretation in the existing agent turn before completion. Read-only finish and failures complete directly.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#aab8d0"/></marker></defs>
  <rect width="1100" height="900" fill="#101521"/>
  <style>text{font-family:Arial,sans-serif;fill:#e5edff;font-size:17px}.small{font-size:14px;fill:#bdc9df}.edge{fill:none;stroke:#aab8d0;stroke-width:2;marker-end:url(#arrow)}.planned{stroke-dasharray:7 5}.node{stroke-width:2;rx:12}</style>
  <text x="45" y="42" font-size="26">Phase 7 — questions, approvals and same-task resume</text>
  <text x="45" y="69" class="small">Implemented · Same production graph · Independent action verification slice included</text>
  <g text-anchor="middle">
    <rect x="110" y="95" width="290" height="42" class="node" fill="#273447" stroke="#91a9c9"/><text x="255" y="122">START</text>
    <rect x="110" y="165" width="290" height="60" class="node" fill="#20364b" stroke="#69b8ed"/><text x="255" y="191">understand</text><text x="255" y="213" class="small">Goal, criteria and task kind</text>
    <rect x="110" y="253" width="290" height="60" class="node" fill="#20364b" stroke="#69b8ed"/><text x="255" y="279">makePlan</text><text x="255" y="301" class="small">Short high-level plan</text>
    <rect x="110" y="345" width="290" height="70" class="node" fill="#332b4b" stroke="#b398ee"/><text x="255" y="374">agent</text><text x="255" y="398" class="small">Choose tool / stable form batch / finish</text>
    <rect x="110" y="470" width="290" height="70" class="node" fill="#203f36" stroke="#75c7a8"/><text x="255" y="498">tools</text><text x="255" y="522" class="small">Execute or interrupt before submission</text>
    <rect x="110" y="590" width="290" height="60" class="node" fill="#453823" stroke="#e1b76c"/><text x="255" y="616">guard</text><text x="255" y="639" class="small">Continue, finish or stop safely</text>
    <rect x="110" y="760" width="290" height="58" class="node" fill="#273447" stroke="#91a9c9"/><text x="255" y="785">complete → END</text><text x="255" y="807" class="small">Honest result; terminal cleanup</text>
    <rect x="435" y="705" width="205" height="55" class="node" fill="#203f36" stroke="#75c7a8"/><text x="537" y="729">verify</text><text x="537" y="750" class="small">Deterministic DB checks</text>
    <rect x="615" y="335" width="390" height="87" class="node planned" fill="#453823" stroke="#e1b76c"/><text x="810" y="364">needs_input</text><text x="810" y="389" class="small">ask_human: questionId + question + choices</text><text x="810" y="411" class="small">Keep browser and checkpoint; no model calls</text>
    <rect x="615" y="470" width="390" height="87" class="node planned" fill="#453823" stroke="#e1b76c"/><text x="810" y="499">awaiting_approval</text><text x="810" y="524" class="small">proposalId + exact action, cost/refund, details</text><text x="810" y="546" class="small">Existing risk gate: no click before approval</text>
    <rect x="615" y="610" width="390" height="87" class="node planned" fill="#20364b" stroke="#69b8ed"/><text x="810" y="637">Validated resume API</text><text x="810" y="661" class="small">/answer · /approve · /reject; resume lock</text><text x="810" y="684" class="small">Command(resume) · same thread_id = taskId</text>
  </g>
  <path class="edge" d="M255 137V165 M255 225V253 M255 313V345 M255 415V470 M255 540V590 M255 650V760"/>
  <text x="115" y="698" class="small">read finish / failure</text>
  <path class="edge" d="M400 635H537V705 M537 760H585V380H400"/>
  <text x="415" y="691" class="small">action finish</text>
  <text x="270" y="445" class="small">one valid call</text>
  <path class="edge" d="M110 620H55V380H110"/><text x="60" y="564" class="small" transform="rotate(-90 60 564)">continue with observations</text>
  <path class="edge planned" d="M400 485H510V378H615"/><text x="425" y="369" class="small">question interrupt</text>
  <path class="edge planned" d="M400 510H615"/><text x="430" y="497" class="small">action interrupt</text>
  <path class="edge planned" d="M1005 378H1040V650H1005 M810 557V610"/>
  <path class="edge planned" d="M615 653H480V532H400"/>
  <text x="495" y="580" class="small">resume tools</text><text x="495" y="601" class="small">recheck fingerprint</text>
  <text x="45" y="865" class="small">Verify returns evidence to agent for goal interpretation · Solid: graph execution · Dashed: implemented human pause/resume · One action per task; repair loops/evidence endpoint deferred</text>
</svg>
