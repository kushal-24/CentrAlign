<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">Phase 5 testing LangGraph: browser action approval</title>
  <desc id="description">Start enters the clickControl node. Ordinary clicks execute directly. Marked clicks pause using interrupt and MemorySaver. Reject returns without clicking. Approve resumes the same node, rechecks the proposal and executes once if unchanged. All paths return an observation and end. Gemini is not involved.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#bbb8ca" stroke-width="1.5"/></marker>
    <style>text{font-family:system-ui,sans-serif;fill:#eeeaf7;font-size:15px}.small{font-size:12px;fill:#bdb8cf}.heading{font-size:23px;font-weight:600}.edge{fill:none;stroke:#bbb8ca;stroke-width:1.6;marker-end:url(#arrow)}.loop{stroke-dasharray:6 4}.node{fill:#352f72;stroke:#a69bea;stroke-width:1}.action{fill:#145047;stroke:#74cbb6}.pause{fill:#63461d;stroke:#dfb66b}.terminal{fill:#373641;stroke:#aaa6b7}</style>
  </defs>
  <rect width="1000" height="760" rx="16" fill="#202027"/>
  <text x="40" y="42" class="heading">Phase 5 · Browser approval testing graph</text>
  <text x="40" y="66" class="small">Testing only — no Gemini. The dashed panel expands the work inside one graph node.</text>
  <rect x="400" y="90" width="180" height="42" rx="21" class="terminal"/><text x="490" y="117" text-anchor="middle">__start__</text>
  <path d="M490 132V167" class="edge"/>
  <rect x="40" y="150" width="920" height="430" rx="12" fill="#25242f" stroke="#777080" stroke-dasharray="5 4"/>
  <text x="60" y="178" class="small">Graph node: clickControl(state) → browser_click(ref)</text>
  <rect x="375" y="190" width="230" height="60" rx="8" class="node"/><text x="490" y="215" text-anchor="middle">Inspect current target</text><text x="490" y="235" text-anchor="middle" class="small">Validate live ref and action details</text>
  <path d="M490 250V273" class="edge"/>
  <polygon points="490,275 580,320 490,365 400,320" class="node"/><text x="490" y="317" text-anchor="middle">Approval</text><text x="490" y="336" text-anchor="middle">required?</text>
  <path d="M400 320H170V445" class="edge"/><text x="260" y="308" class="small">No: ordinary click</text>
  <path d="M580 320H755" class="edge"/><text x="635" y="308" class="small">Yes</text>
  <rect x="755" y="285" width="175" height="72" rx="8" class="pause"/><text x="842" y="309" text-anchor="middle">interrupt(proposal)</text><text x="842" y="331" text-anchor="middle" class="small">Pause; no site mutation</text><text x="842" y="347" text-anchor="middle" class="small">MemorySaver + task thread</text>
  <path d="M842 357V402H630" class="edge loop"/><text x="720" y="391" class="small">Command({ resume: answer })</text>
  <rect x="400" y="377" width="230" height="60" rx="8" class="node"/><text x="515" y="401" text-anchor="middle">Re-enter clickControl</text><text x="515" y="421" text-anchor="middle" class="small">Same pending proposal and browser</text>
  <path d="M515 437V460H305" class="edge"/><text x="318" y="450" class="small">Approved + unchanged; consume once</text>
  <rect x="60" y="460" width="245" height="65" rx="8" class="action"/><text x="182" y="485" text-anchor="middle">Execute browser click</text><text x="182" y="507" text-anchor="middle" class="small">Dialog accepts only for approved click</text>
  <path d="M630 407H810V460" class="edge"/>
  <rect x="680" y="460" width="250" height="65" rx="8" class="terminal"/><text x="805" y="485" text-anchor="middle">Return without clicking</text><text x="805" y="507" text-anchor="middle" class="small">Rejected, changed, stale or invalid</text>
  <path d="M182 525V604H390" class="edge"/><path d="M805 525V604H590" class="edge"/>
  <rect x="390" y="583" width="200" height="42" rx="8" class="node"/><text x="490" y="610" text-anchor="middle">Return tool observation</text>
  <path d="M490 625V649" class="edge"/>
  <rect x="400" y="650" width="180" height="42" rx="21" class="terminal"/><text x="490" y="677" text-anchor="middle">__end__</text>
  <text x="40" y="725" class="small">Legend: purple = inspection/node work · amber = human pause · green = browser action · grey = end/no click</text>
  <text x="40" y="744" class="small">Solid arrows = flow · dashed arrow = external resume · errors never trigger automatic resubmission</text>
</svg>
